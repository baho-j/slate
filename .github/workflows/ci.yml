name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  pr-template:
    name: PR template
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the description follows the template
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          check() {
            if ! grep -qF "$1" <<<"$BODY"; then
              echo "::error::PR description is missing: $1"
              fail=1
            fi
          }
          check "Closes #"
          check "## What changed & why"
          check "## How it was tested"
          check "## Definition of done"
          if [ "$fail" -ne 0 ]; then
            echo "Fill in .github/pull_request_template.md before merging."
            exit 1
          fi
          echo "PR description follows the template."

  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: slate_test
          POSTGRES_USER: slate
          POSTGRES_PASSWORD: slate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_pgsql, openssl, fileinfo, curl, zip, intl, bcmath
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: vendor/bin/pint --test app database tests

      - name: Run tests with coverage
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: slate_test
          DB_USERNAME: slate
          DB_PASSWORD: slate
        run: php artisan test --coverage --coverage-clover=coverage.xml | tee coverage-summary.txt

      - name: Upload API coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            apps/api/coverage-summary.txt
            apps/api/coverage.xml

  web:
    name: Web (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm run web:ci

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests with coverage
        run: pnpm run test:coverage --reporter=default --coverage.reporter=text --coverage.reporter=json-summary | tee web-coverage-summary.txt

      - name: Upload web coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: |
            web-coverage-summary.txt
            apps/web/coverage/coverage-summary.json

      - name: Build
        env:
          VITE_API_URL: http://localhost:8000/api
        run: pnpm run build

  contract:
    name: API contract (Newman)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: slate
          POSTGRES_USER: slate
          POSTGRES_PASSWORD: slate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_pgsql, openssl, fileinfo, curl, zip, intl, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Boot the API against a seeded database
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: slate
          DB_USERNAME: slate
          DB_PASSWORD: slate
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force --seed
          php artisan serve --host=127.0.0.1 --port=8000 &
          npx --yes wait-on -t 60000 http://127.0.0.1:8000/api/health

      - name: Run the collection
        run: >-
          npx --yes newman run apps/api/postman/slate.postman_collection.json
          -e apps/api/postman/slate.local.postman_environment.json
          --reporters cli,json
          --reporter-json-export newman-report.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.json

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: slate
          POSTGRES_USER: slate
          POSTGRES_PASSWORD: slate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_pgsql, openssl, fileinfo, curl, zip, intl, bcmath
          coverage: none

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the API
        working-directory: apps/api
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          cp .env.example .env
          php artisan key:generate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        env:
          E2E_DB_PORT: '5432'
          VITE_API_URL: http://127.0.0.1:8000/api
        run: pnpm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
