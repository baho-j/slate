services:
  postgres:
    image: postgres:16-alpine
    container_name: slate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: slate
      POSTGRES_USER: slate
      POSTGRES_PASSWORD: slate
    ports:
      - "5432:5432"
    volumes:
      - slate-postgres-data:/var/lib/postgresql/data

volumes:
  slate-postgres-data:
